name: efekt

# SPHS phaser VST3 for Intel Mac (iMac 2011, macOS 10.13), following the proven
# HARMONY ENGINE build recipe:
#   macos-15-intel + Xcode + CMake/Xcode generator + Release + C++17 + x86_64 only
#   + macOS 10.13 + Steinberg VST3 SDK commit 3cdf9ca5 (recursive submodules)
#   + own C++ DSP + native Cocoa editor + tests + ad-hoc codesign + ditto packaging.
#
# Order of uploads: this file FIRST, then AX300B-SPHS.zip. The ZIP starts the build.

on:
  push:
    paths:
      - 'AX300B-SPHS.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      # proven Steinberg VST3 SDK revision (3.8.1) - not changed without a decision
      SDK_COMMIT: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
      MACOSX_DEPLOYMENT_TARGET: "10.13"

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Unpack the project ZIP
        run: |
          set -euo pipefail
          test -f AX300B-SPHS.zip
          rm -rf src && mkdir src
          unzip -q AX300B-SPHS.zip -d src
          ROOT="$PWD/src/AX300B-SPHS"
          test -f "$ROOT/CMakeLists.txt"
          test -d "$ROOT/plugin" && test -d "$ROOT/dsp"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Fetch the proven VST3 SDK (recursive submodules)
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/steinbergmedia/vst3sdk.git
          git -C vst3sdk checkout "$SDK_COMMIT"
          git -C vst3sdk submodule update --init --recursive
          test "$(git -C vst3sdk rev-parse HEAD)" = "$SDK_COMMIT"
          git -C vst3sdk submodule status

      - name: Core DSP and parameter/state tests (must pass before the plug-in build)
        run: |
          set -euo pipefail
          cmake -S "$PROJECT_ROOT" -B build-dsp -DSPHS_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          cmake --build build-dsp --config Release -j 4
          ./build-dsp/tests/sphs_dsp_tests | tee dsp_tests.log
          grep -q ", 0 failed" dsp_tests.log

      - name: Configure the plug-in (Xcode, x86_64 only, macOS 10.13, Release)
        run: |
          set -euo pipefail
          cmake -S "$PROJECT_ROOT" -B build -G Xcode \
                -DVST3_SDK_ROOT="$PWD/vst3sdk" \
                -DCMAKE_OSX_ARCHITECTURES=x86_64 \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
                -DSMTG_BUILD_UNIVERSAL_BINARY=OFF \
                -DSMTG_CREATE_PLUGIN_LINK=OFF \
                -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF \
                -DSMTG_RUN_VST_VALIDATOR=OFF \
                -DSPHS_BUILD_TESTS=OFF
          # the Steinberg helper must have put macmain.cpp (bundleEntry / bundleExit) into the target
          grep -q "macmain.cpp" build/AX300B_SPHS.xcodeproj/project.pbxproj

      - name: Build the plug-in and the Steinberg validator
        run: |
          set -euo pipefail
          cmake --build build --config Release --target SPHS-Phaser -- -quiet
          cmake --build build --config Release --target validator -- -quiet

      - name: Check the final VST3 (FAIL on any mismatch)
        run: |
          set -euo pipefail
          VST="$(find build -type d -name 'SPHS-Phaser.vst3' | head -1)"
          test -n "$VST"
          echo "VST3_BUNDLE=$PWD/$VST" >> "$GITHUB_ENV"
          BIN="$VST/Contents/MacOS/SPHS-Phaser"
          test -f "$VST/Contents/Info.plist"
          test -x "$BIN"
          echo "--- file type"; file "$BIN"
          file "$BIN" | grep -q "Mach-O 64-bit bundle x86_64"
          echo "--- architectures"; lipo -archs "$BIN"
          test "$(lipo -archs "$BIN")" = "x86_64"
          echo "--- deployment target"
          MINOS="$(otool -l "$BIN" | awk '/LC_VERSION_MIN_MACOSX/{f=1} f&&/version /{print $2; exit}')"
          if [ -z "$MINOS" ]; then MINOS="$(otool -l "$BIN" | awk '/LC_BUILD_VERSION/{f=1} f&&/minos /{print $2; exit}')"; fi
          echo "minimum macOS in the binary: $MINOS"
          test "$MINOS" = "10.13" || test "$MINOS" = "10.13.0"
          echo "--- exported entry points"
          nm -gU "$BIN" | grep -E 'GetPluginFactory|bundleEntry|bundleExit'
          nm -gU "$BIN" | grep -q "GetPluginFactory"
          nm -gU "$BIN" | grep -q "bundleEntry"
          nm -gU "$BIN" | grep -q "bundleExit"
          echo "--- Info.plist"; plutil -p "$VST/Contents/Info.plist"
          echo "--- ad-hoc signing"
          codesign --force --deep -s - "$VST"
          codesign --verify --deep --verbose=2 "$VST"

      - name: Steinberg VST3 validator
        run: |
          set -euo pipefail
          VAL="$(find build -type f -name validator -perm +111 | head -1)"
          test -n "$VAL"
          "$VAL" "$VST3_BUNDLE" | tee validator.log
          grep -q ", 0 tests failed" validator.log

      - name: Pack the .vst3 bundle
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "$VST3_BUNDLE" SPHS-Phaser-macOS-x86_64.zip
          ls -la SPHS-Phaser-macOS-x86_64.zip

      - name: Upload the plug-in
        uses: actions/upload-artifact@v4
        with:
          name: SPHS-Phaser-macOS-x86_64
          path: |
            SPHS-Phaser-macOS-x86_64.zip
            validator.log
            dsp_tests.log
          if-no-files-found: error
